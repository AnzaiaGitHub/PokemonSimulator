<article
  class="relative flex flex-col items-center rounded-2xl border border-slate-800 bg-slate-900/60 p-4 transition hover:border-red-500/40 hover:bg-slate-900"
  [class.opacity-50]="isEmpty()"
>
  <div class="absolute top-2 left-2 text-xs font-semibold text-slate-500">Slot {{ index() + 1 }}</div>

  @if (isEmpty()) {
    <div class="flex flex-col items-center justify-center h-40 w-full text-center text-slate-500">
      <svg class="h-16 w-16 opacity-30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
        <line x1="12" y1="8" x2="12" y2="16" />
        <line x1="8" y1="12" x2="16" y2="12" />
      </svg>
      <p class="mt-2 text-sm font-medium">Empty</p>
      <a routerLink="/pokedex" class="mt-2 text-xs font-semibold text-red-400 hover:text-red-300 underline">Browse Pokédex</a>
    </div>
  } @else {
    <img
      [src]="imageSrc()"
      width="96"
      height="96"
      [alt]="'Artwork of ' + name()"
      (error)="onImageError()"
      class="h-32 w-32 object-cover rounded-xl"
    />

    <h3 class="mt-3 text-lg font-bold capitalize text-white text-center">{{ name() }}</h3>

    <div class="mt-2 flex flex-wrap justify-center gap-1">
      @for (type of types(); track type) {
        <app-pokemon-type-badge [type]="type" size="sm" />
      }
    </div>

    <p class="mt-2 text-xs text-slate-400">{{ moveCount() }}/4 moves</p>
  }

  <div class="mt-4 flex w-full items-center justify-center gap-2">
    @if (!isEmpty()) {
      <button
        type="button"
        (click)="onRemove()"
        class="flex-1 rounded-xl border border-red-500/50 bg-red-500/10 px-3 py-1.5 text-xs font-semibold text-red-300 transition hover:bg-red-500/20 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-500"
        aria-label="Remove {{ name() }} from team"
      >
        Remove
      </button>

      <button
        type="button"
        (click)="onMoveUp()"
        [disabled]="!canMoveUp()"
        class="rounded-xl border border-slate-700 bg-slate-800/80 px-3 py-1.5 text-xs font-semibold text-slate-200 transition hover:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-500"
        aria-label="Move {{ name() }} up"
        [attr.aria-disabled]="!canMoveUp()"
      >
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <polyline points="18 15 12 9 6 15" />
        </svg>
      </button>

      <button
        type="button"
        (click)="onMoveDown()"
        [disabled]="!canMoveDown()"
        class="rounded-xl border border-slate-700 bg-slate-800/80 px-3 py-1.5 text-xs font-semibold text-slate-200 transition hover:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-500"
        aria-label="Move {{ name() }} down"
        [attr.aria-disabled]="!canMoveDown()"
      >
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </button>
    }
  </div>
</article>
