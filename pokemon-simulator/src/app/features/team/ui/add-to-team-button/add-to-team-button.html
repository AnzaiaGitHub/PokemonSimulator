<button
  type="button"
  [disabled]="!canAdd()"
  (click)="add()"
  [attr.title]="disabledReason()"
  class="w-full rounded-xl border bg-slate-800/80 px-4 py-2 text-sm font-semibold transition hover:bg-slate-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-500 disabled:opacity-50 disabled:cursor-not-allowed"
  [class.border-red-500]="messageType() === 'error'"
  [class.border-green-500]="messageType() === 'success'"
  [class.border-slate-600]="messageType() === 'info'"
  [attr.aria-busy]="loading()"
  [attr.aria-disabled]="!canAdd()"
>
  @if (loading()) {
    <span class="flex items-center gap-2">
      <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" aria-hidden="true">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none" />
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
      </svg>
      Adding…
    </span>
  } @else if (!isTeamReady()) {
    <span class="flex items-center gap-2">
      <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" aria-hidden="true">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none" />
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
      </svg>
      Loading team…
    </span>
  } @else if (isInTeam()) {
    <span class="flex items-center gap-2">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M22 11.08V12a10 10 0 11-5.93-9.14" />
        <polyline points="22 4 12 14.01 9 11.01" />
      </svg>
      In team
    </span>
  } @else if (isFull()) {
    <span class="flex items-center gap-2">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </svg>
      Team full
    </span>
  } @else {
    <span class="flex items-center gap-2">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
      Add to team
    </span>
  }
</button>

@if (disabledReason() && !isInTeam()) {
  <p class="mt-1 text-[11px] font-medium text-slate-400">{{ disabledReason() }}</p>
}

@if (message()) {
  <p
    class="mt-2 text-xs font-medium"
    [class.text-green-300]="messageType() === 'success'"
    [class.text-red-300]="messageType() === 'error'"
    [class.text-sky-300]="messageType() === 'info'"
    role="status"
    aria-live="polite"
  >
    {{ message() }}
  </p>
}
