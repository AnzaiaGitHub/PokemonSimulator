<section class="mx-auto max-w-5xl">
  <a
    routerLink="/pokedex"
    class="inline-flex items-center gap-2 rounded-lg text-sm font-semibold text-slate-400 transition hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-500"
  >
    <span aria-hidden="true">&larr;</span>
    Back to Pokédex
  </a>

  <div class="mt-6 grid gap-8 lg:grid-cols-[minmax(0,1fr)_minmax(0,1.2fr)]">
    <div
      class="flex flex-col items-center justify-center rounded-3xl border border-slate-800 bg-gradient-to-b from-slate-900 to-slate-950 p-8"
    >
      <p class="self-end text-sm font-bold text-slate-500">{{ displayId() }}</p>

      <img
        [src]="imageSrc()"
        width="256"
        height="256"
        [alt]="'Official artwork of ' + pokemon().name"
        (error)="onImageError()"
        class="h-64 w-64"
      />

      <h1 class="mt-4 text-3xl font-black capitalize tracking-tight text-white">
        {{ pokemon().name }}
      </h1>

      <div class="mt-3 flex flex-wrap justify-center gap-2">
        @for (type of pokemon().types; track type) {
          <app-pokemon-type-badge [type]="type" />
        }
      </div>
    </div>

    <div class="flex flex-col gap-6">
      <dl class="grid grid-cols-2 gap-4">
        <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-5">
          <dt class="text-xs font-semibold uppercase tracking-widest text-slate-400">Height</dt>
          <dd class="mt-2 text-2xl font-bold text-white">{{ pokemon().heightInMeters }} m</dd>
        </div>

        <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-5">
          <dt class="text-xs font-semibold uppercase tracking-widest text-slate-400">Weight</dt>
          <dd class="mt-2 text-2xl font-bold text-white">{{ pokemon().weightInKilograms }} kg</dd>
        </div>
      </dl>

      @defer {
        <app-pokemon-stats [stats]="pokemon().stats" />
      }
    </div>
  </div>
</section>
