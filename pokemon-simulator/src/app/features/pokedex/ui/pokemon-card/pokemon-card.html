<a
  [routerLink]="['/pokemon', pokemon().name]"
  class="group flex flex-col items-center rounded-2xl border border-slate-800 bg-slate-900/60 p-4 transition hover:-translate-y-0.5 hover:border-red-500/40 hover:bg-slate-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-500"
>
  <span class="self-end text-xs font-semibold text-slate-500">{{ displayId() }}</span>

  <img
    [src]="imageSrc()"
    width="96"
    height="96"
    [alt]="'Sprite of ' + pokemon().name"
    (error)="onImageError()"
    class="h-24 w-24 transition group-hover:scale-105"
  />

  <h2 class="mt-2 text-sm font-bold capitalize text-white">{{ pokemon().name }}</h2>
</a>
