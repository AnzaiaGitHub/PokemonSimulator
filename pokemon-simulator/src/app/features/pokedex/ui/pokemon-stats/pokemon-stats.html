<div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-5">
  <h2 class="text-sm font-bold uppercase tracking-widest text-slate-400">Base stats</h2>

  <dl class="mt-4 space-y-3">
    @for (row of rows(); track row.label) {
      <div class="grid grid-cols-[4rem_2.5rem_1fr] items-center gap-3">
        <dt class="text-xs font-semibold uppercase text-slate-400">{{ row.label }}</dt>
        <dd class="text-right text-sm font-bold text-white">{{ row.value }}</dd>
        <div class="h-2 overflow-hidden rounded-full bg-slate-800" role="presentation">
          <div class="h-full rounded-full bg-red-500" [style.width.%]="percentage(row.value)"></div>
        </div>
      </div>
    }
  </dl>
</div>
