@switch (status()) {
  @case ('loading') {
    <div role="status" aria-live="polite">
      <span class="sr-only">Loading…</span>
      <div
        class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5"
        aria-hidden="true"
      >
        @for (item of skeletonItems; track item) {
          <div class="h-56 animate-pulse rounded-2xl border border-slate-800 bg-slate-900/70"></div>
        }
      </div>
    </div>
  }

  @case ('error') {
    <div
      role="alert"
      class="flex flex-col items-center justify-center gap-4 rounded-2xl border border-red-500/30 bg-red-500/5 px-6 py-12 text-center"
    >
      <p class="text-sm font-medium text-red-200">
        {{ errorMessage() ?? 'Something went wrong.' }}
      </p>
      <button
        type="button"
        (click)="retry.emit()"
        class="rounded-xl bg-red-500 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-red-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-500"
      >
        Retry
      </button>
    </div>
  }

  @case ('ready') {
    @if (isEmpty()) {
      <div
        class="flex flex-col items-center justify-center gap-4 rounded-2xl border border-slate-800 bg-slate-900/60 px-6 py-12 text-center"
      >
        <p class="text-sm font-medium text-slate-300">{{ emptyMessage() }}</p>
        <ng-content select="[emptyAction]" />
      </div>
    } @else {
      <ng-content />
    }
  }
}
